        <h1 class="text-center section-title" data-i18n="events-title">📅 Événements à venir</h1>
        <div id="events-container" class="row justify-content-center">
            <!-- Les événements seront chargés ici -->
        </div>
    </main>

    <script>
    fetch("events.json")
      .then(response => response.json())
      .then(events => {
        let container = document.getElementById("events-container");
        events.sort((a, b) => new Date(a.date) - new Date(b.date));
        
        const currentLang = localStorage.getItem('lang') || 'fr';
        const registerText = {
            fr: "S'inscrire à l'événement",
            en: "Register for the event",
            ar: "سجل في الحدث"
        };

        events.forEach(event => {
          let col = document.createElement("div");
          col.classList.add("col-12", "col-lg-8");

          col.innerHTML = `
            <div class="card event-card">
              ${event.image ? `<img src="${event.image}" class="card-img-top" alt="${event.title}">` : ""}
              <div class="card-body text-center p-4">
                <h3 class="card-title">${event.title}</h3>
                <h6 class="text-muted mb-3"><i class="far fa-calendar-alt me-2"></i>${new Date(event.date).toLocaleDateString(currentLang, {day: 'numeric', month: 'long', year: 'numeric'})}</h6>
                <p class="card-text">${event.description}</p>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSf8gE1bgBc8-_N-3RLD3TTRNPzPy0_krkq_gTmKpudUFwrsCQ/viewform" target="_blank" class="btn btn-primary mt-3">${registerText[currentLang] || registerText['fr']}</a>
              </div>
            </div>
          `;
          container.appendChild(col);
        });
      })
      .catch(error => console.error("Erreur lors du chargement des événements :", error));
    </script>
